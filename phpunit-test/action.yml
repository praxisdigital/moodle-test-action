name: PHPUnit test
description: 'Run PHPUnit tests for Moodle'

inputs:
  plugin:
    description: 'Plugin name (component name). Optional override; if empty, it will be auto-detected from version.php.'
    required: false
    default: ''
  plugin-path:
    description: 'Plugin path. Optional override; if empty, it will be auto-detected from version.php.'
    required: false
    default: ''
  php:
    description: 'PHP version'
    required: true
  moodle:
    description: 'Moodle version (branch, tag or commit)'
    required: true
  moodle_repository:
    description: 'Moodle repository, e.g. moodle/moodle'
    required: false
    default: 'moodle/moodle'
  os:
    description: 'Operating system'
    required: true
  additional_phpunit_arguments:
    description: 'Additional arguments to pass to phpunit'
    required: false
    default: ''
  org:
    description: 'Organization'
    required: false
    default: 'praxisdigital'
  dependencies:
    description: >
      Plugin dependencies.
      Format: org/repo@ref
      Example: |
        praxisdigital/assignsubmission_pxaiwriter@master
        praxisdigital/mod_smartlink@MOODLE_42_STABLE
    required: false
    default: ''
  dbtype:
    description: 'Database type (mysqli, pgsql, sqlsrv)'
    required: false
    default: 'mysqli'
  experimental:
    description: 'Is experimental run'
    required: false
    default: 'false'
  PRIVATE_REPO_TOKEN:
    description: 'Optional GitHub App installation token (or other token) for private Moodle/dependency repositories'
    required: false
    default: ''
  fail_on_empty_test_suite:
    description: 'Fail the job if PHPUnit executes no tests'
    required: false
    default: 'true'
  checkout_ref:
    description: 'Git ref to check out for the plugin under test'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setting up DB mysql
      if: ${{ inputs.dbtype == 'mysqli' }}
      uses: praxisdigital/mysql-action@tmpfs-and-docker-patch
      with:
        collation server: utf8mb4_danish_ci
        mysql version: 8
        mysql database: test
        mysql user: test
        mysql password: test
        use tmpfs: true

    - name: Setting up DB pgsql
      if: ${{ inputs.dbtype == 'pgsql' }}
      uses: m4nu56/postgresql-action@v1
      with:
        postgresql version: 16
        postgresql db: test
        postgresql user: test
        postgresql password: test

    - name: Setting up DB mssql
      if: ${{ inputs.dbtype == 'sqlsrv' }}
      uses: praxisdigital/setup-mssql-server@main
      with:
        version: 2022
        user: test
        password: test
        database: test

    - name: Setting up PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php }}
        coverage: none
        ini-values: 'max_input_vars=5000'
        extensions: sqlsrv, pdo_sqlsrv

    - name: Download & Setup MSSQL ODBC driver for PHP
      if: ${{ inputs.dbtype == 'sqlsrv' }}
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php }}
      run: |
        set -euo pipefail
        UBUNTU_VERSION="$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)"
        if ! [[ "18.04 20.04 22.04 24.04 25.10" == *"$UBUNTU_VERSION"* ]]; then
          echo "Ubuntu $UBUNTU_VERSION is not currently supported."
          exit 1
        fi

        curl -sSL -O "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb"
        sudo dpkg -i packages-microsoft-prod.deb
        rm packages-microsoft-prod.deb

        MICROSOFT_SOURCE="$(find /etc/apt/sources.list.d -name '*microsoft*' | head -n 1)"
        if [ -z "$MICROSOFT_SOURCE" ]; then
          echo "Microsoft apt source not found after packages-microsoft-prod install."
          exit 1
        fi

        sudo apt-get update \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          -o Dir::Etc::sourcelist="$MICROSOFT_SOURCE" \
          -o Dir::Etc::sourceparts="-" \
          -o APT::Get::List-Cleanup="0"

        sudo DEBIAN_FRONTEND=noninteractive ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20

        sudo phpenmod -v "$PHP_VERSION" sqlsrv pdo_sqlsrv
        php -m | grep -q 'sqlsrv' && echo "sqlsrv extension installed"
        php -m | grep -q 'pdo_sqlsrv' && echo "pdo_sqlsrv extension installed"

    - name: Resolve Moodle checkout auth
      id: moodle-auth
      shell: bash
      env:
        MOODLE_REPOSITORY: ${{ inputs.moodle_repository }}
        PRIVATE_REPO_TOKEN: ${{ inputs.PRIVATE_REPO_TOKEN }}
      run: |
        moodle_owner="${MOODLE_REPOSITORY%%/*}"
        if [ "$moodle_owner" = "moodle" ]; then
          echo "is_public=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$PRIVATE_REPO_TOKEN" ]; then
          echo "::error::Private Moodle repository ${MOODLE_REPOSITORY} requires PRIVATE_REPO_TOKEN (GitHub App installation token with Contents: Read)."
          exit 1
        fi

        echo "is_public=false" >> "$GITHUB_OUTPUT"

    - name: Preflight private Moodle access
      if: ${{ steps.moodle-auth.outputs.is_public != 'true' }}
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ inputs.PRIVATE_REPO_TOKEN }}
        MOODLE_REPOSITORY: ${{ inputs.moodle_repository }}
        MOODLE_REF: ${{ inputs.moodle }}
      run: |
        set -euo pipefail
        api() {
          local path="$1"
          curl -sS -o /tmp/moodle-api.json -w "%{http_code}" \
            -H "Authorization: Bearer ${PRIVATE_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com${path}"
        }

        code="$(api "/repos/${MOODLE_REPOSITORY}")"
        if [ "$code" = "404" ] || [ "$code" = "403" ]; then
          echo "::error::Cannot access ${MOODLE_REPOSITORY} (HTTP ${code}). Grant the GitHub App Contents: Read on this repository (include it in the App installation)."
          exit 1
        fi
        if [ "$code" != "200" ]; then
          echo "::error::GitHub API lookup for ${MOODLE_REPOSITORY} failed (HTTP ${code})."
          cat /tmp/moodle-api.json || true
          exit 1
        fi

        for path in \
          "/repos/${MOODLE_REPOSITORY}/git/ref/heads/${MOODLE_REF}" \
          "/repos/${MOODLE_REPOSITORY}/git/ref/tags/${MOODLE_REF}" \
          "/repos/${MOODLE_REPOSITORY}/commits/${MOODLE_REF}"
        do
          code="$(api "$path")"
          if [ "$code" = "200" ]; then
            echo "Verified ${MOODLE_REPOSITORY}@${MOODLE_REF} is reachable with the private checkout token."
            exit 0
          fi
        done

        echo "::error::Ref ${MOODLE_REF} was not found on ${MOODLE_REPOSITORY} (checked branch, tag, and commit). Confirm the Moodle version exists on that repository."
        exit 1

    - name: Checking out code from ${{ inputs.moodle_repository }}
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.moodle_repository }}
        ref: ${{ inputs.moodle }}
        path: ${{ github.workspace }}/moodle
        token: ${{ steps.moodle-auth.outputs.is_public == 'true' && github.token || inputs.PRIVATE_REPO_TOKEN }}
        persist-credentials: false

    - name: Setting up Moodle dataroot & config
      shell: bash
      env:
        dbtype: ${{ inputs.dbtype }}
      run: |
        echo "pathtophp=$(which php)" >> $GITHUB_ENV # Inject installed pathtophp to env. The template config needs it.
        touch $GITHUB_WORKSPACE/moodle/config.php
        mkdir -p $GITHUB_WORKSPACE/moodledata
        mkdir -p $GITHUB_WORKSPACE/moodledata/localcachedir
        echo '<?php' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'unset($CFG);' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'global $CFG;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG = new stdClass();' >> $GITHUB_WORKSPACE/moodle/config.php
        echo "\$CFG->dbtype   = '$dbtype';" >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dblibrary = "native";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dbhost    = "127.0.0.1";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dbname    = "test";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dbuser    = "test";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dbpass    = "test";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->prefix    = "m_";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dboptions = [' >> $GITHUB_WORKSPACE/moodle/config.php
        test "$dbtype" = "mysqli" && echo '    "dbcollation" => "utf8mb4_unicode_ci",' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '    "extrainfo" => [' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '        "TrustServerCertificate" => true' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '    ]' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '];' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$host = "localhost";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->wwwroot   = "http://{$host}";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo "\$CFG->dataroot  = '$GITHUB_WORKSPACE/moodledata';" >> $GITHUB_WORKSPACE/moodle/config.php
        echo "\$CFG->localcachedir  = '$GITHUB_WORKSPACE/moodledata/localcachedir';" >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->admin     = "admin";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->directorypermissions = 0777;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->debug = (E_ALL);' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->debugdisplay = 1;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->debugstringids = 1;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->perfdebug = 15;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->debugpageinfo = 1;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->allowthemechangeonurl = 1;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->passwordpolicy = 0;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->cronclionly = 0;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->pathtophp = getenv("pathtophp");' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->phpunit_dataroot  = realpath(dirname(__DIR__)) . "/phpunitdata";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->phpunit_prefix = "t_";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'define("TEST_EXTERNAL_FILES_HTTP_URL", "http://$host:8080");' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'define("TEST_EXTERNAL_FILES_HTTPS_URL", "http://$host:8080");' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'define("TEST_SESSION_REDIS_HOST", $host);' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'define("TEST_CACHESTORE_REDIS_TESTSERVERS", $host);' >> $GITHUB_WORKSPACE/moodle/config.php
        if [ -d "$GITHUB_WORKSPACE/moodle/public" ]; then
          echo 'require_once(__DIR__ . "/public/lib/setup.php");' >> $GITHUB_WORKSPACE/moodle/config.php
        else
          echo 'require_once(__DIR__ . "/lib/setup.php");' >> $GITHUB_WORKSPACE/moodle/config.php
        fi

    - name: Check out code from ${{ github.repository }}
      uses: actions/checkout@v6
      with:
        path: ${{ github.workspace }}/plugin-src
        ref: ${{ inputs.checkout_ref || github.ref }}

    - name: Resolve plugin component and install path
      shell: bash
      env:
        PLUGIN_OVERRIDE: ${{ inputs.plugin }}
        PLUGIN_PATH_OVERRIDE: ${{ inputs.plugin-path }}
      run: |
        VERSION_FILE="$GITHUB_WORKSPACE/plugin-src/version.php"
        if [ ! -f "$VERSION_FILE" ]; then
          echo "version.php not found at $VERSION_FILE"
          exit 1
        fi
        component=$(sed -En 's/^[[:space:]]*\$plugin->component[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'][[:space:]]*;.*/\1/p' "$VERSION_FILE")
        if [ -z "$component" ]; then
          echo "Failed to determine component name from $VERSION_FILE"
          exit 1
        fi
        echo "Auto-detected component from version.php: $component"

        if [ -n "$PLUGIN_OVERRIDE" ]; then
          echo "Overriding auto-detected component with inputs.plugin: $PLUGIN_OVERRIDE"
          component="$PLUGIN_OVERRIDE"
        fi
        if ! [[ "$component" =~ ^[a-z][a-z0-9]*_[a-z][a-z0-9_]*$ ]]; then
          echo "Invalid Moodle component name: $component"
          exit 1
        fi

        if [ -n "$PLUGIN_PATH_OVERRIDE" ]; then
          if [ -d "$GITHUB_WORKSPACE/moodle/public" ]; then
            path="public/$PLUGIN_PATH_OVERRIDE"
          else
            path="$PLUGIN_PATH_OVERRIDE"
          fi
        else
          path=$(php -r "CONST CLI_SCRIPT = true; require_once '$GITHUB_WORKSPACE/moodle/config.php'; if (file_exists('$GITHUB_WORKSPACE/moodle/public/lib/classes/component.php')) { require_once '$GITHUB_WORKSPACE/moodle/public/lib/classes/component.php'; } else { require_once '$GITHUB_WORKSPACE/moodle/lib/classes/component.php'; } class_exists('core\\component') === false && class_alias('core_component', '\\core\\component'); use core\\component; [\$plugin_type, \$name] = component::normalize_component('$component'); \$plugin_types = component::get_plugin_types(); echo empty(\$plugin_types[\$plugin_type]) ? '' : \$plugin_types[\$plugin_type] . '/' . \$name;")
          if [ -z "$path" ]; then
            echo "Failed to determine install path for component: $component"
            exit 1
          fi
          path=${path#"$GITHUB_WORKSPACE/moodle/"}
        fi

        echo "Final component: $component"
        echo "Resolved plugin path: $path"
        echo "component=$component" >> $GITHUB_ENV
        echo "resolved_plugin_path=$path" >> $GITHUB_ENV

    - name: Install plugin under test
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/moodle/$(dirname "$resolved_plugin_path")"
        rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/plugin-src/" "$GITHUB_WORKSPACE/moodle/$resolved_plugin_path/"

    - name: Checking out dependencies
      if: ${{ inputs.dependencies != '' }}
      shell: bash
      env:
        DEPENDENCIES: ${{ inputs.dependencies }}
        PRIVATE_REPO_TOKEN: ${{ inputs.PRIVATE_REPO_TOKEN }}
      run: |
        # dependencies are in the format of org/repo@ref
        dependencies="$DEPENDENCIES"
        if [[ -z $dependencies ]]; then
          echo "No dependencies to checkout"
          exit 0
        fi
        for dep in $dependencies; do
          repo=$(echo $dep | cut -d@ -f1)
          ref=$(echo $dep | cut -d@ -f2)
          url="https://github.com/${repo}.git"

          if [ -n "$PRIVATE_REPO_TOKEN" ]; then
            printf "Checking out ${repo}@${ref} from github.com (authenticated)\n"
            url="https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${repo}.git"
          else
            printf "Checking out (public) ${repo}@${ref} from github.com\n"
          fi

          # Get component name from version.php by cloning to a temp dir
          echo "Auto determining component name for repo: $repo ..."
          tmpdir=$GITHUB_WORKSPACE/tmp
          mkdir -p $tmpdir
          git clone --quiet "$url" "$tmpdir/$repo"
          component=$(sed -En 's/^[[:space:]]*\$plugin->component[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'][[:space:]]*;.*/\1/p' $tmpdir/$repo/version.php)
          rm -rf $tmpdir/$repo
          echo "Auto determined component name: $component"

          # Calculate the path to clone to inside moodle based on component name
          echo "Auto determining path for component: $component ..."
          path=$(php -r "CONST CLI_SCRIPT = true; require_once '$GITHUB_WORKSPACE/moodle/config.php'; if (file_exists('$GITHUB_WORKSPACE/moodle/public/lib/classes/component.php')) { require_once '$GITHUB_WORKSPACE/moodle/public/lib/classes/component.php'; } else { require_once '$GITHUB_WORKSPACE/moodle/lib/classes/component.php'; } class_exists('core\\component') === false && class_alias('core_component', '\\core\\component'); use core\\component; [\$plugin_type, \$name] = component::normalize_component('$component'); \$plugin_types = component::get_plugin_types();echo empty(\$plugin_types[\$plugin_type]) ? '' : \$plugin_types[\$plugin_type] . '/' . \$name;")
          echo "Auto determined path: $path"

          echo "Cloning $repo@$ref to $path ..."
          git clone "$url" "$path"
          git -C "$path" checkout "$ref"
        done

    - name: Setting up PHPUnit
      shell: bash
      run: |
        echo "pathtophp=$(which php)" >> $GITHUB_ENV # Inject installed pathtophp to env. The template config needs it.
        mkdir $GITHUB_WORKSPACE/../moodledata
        sudo locale-gen en_AU.UTF-8
        test -f $GITHUB_WORKSPACE/moodle/public/admin/tool/phpunit/cli/init.php && php $GITHUB_WORKSPACE/moodle/public/admin/tool/phpunit/cli/init.php --no-composer-self-update || php $GITHUB_WORKSPACE/moodle/admin/tool/phpunit/cli/init.php --no-composer-self-update

    - name: Running PHPUnit tests
      shell: bash
      env:
        ADDITIONAL_STUFF: ${{ inputs.additional_phpunit_arguments }}
        FAIL_ON_EMPTY: ${{ inputs.fail_on_empty_test_suite }}
      run: |
        PHPUNIT="$GITHUB_WORKSPACE/moodle/vendor/bin/phpunit"
        PLUGIN_FULL="$GITHUB_WORKSPACE/moodle/$resolved_plugin_path"
        EXTRA=""
        if [ "$FAIL_ON_EMPTY" = "true" ]; then
          EXTRA="--fail-on-empty-test-suite"
        fi
        if [ -f "$PLUGIN_FULL/phpunit.xml" ]; then
          echo "Running phpunit on ${component} with plugin phpunit.xml"
          "$PHPUNIT" -c "$PLUGIN_FULL/phpunit.xml" --testdox --colors $EXTRA $ADDITIONAL_STUFF
        else
          echo "Running phpunit on ${component} with testsuite from Moodle phpunit.xml"
          "$PHPUNIT" -c "$GITHUB_WORKSPACE/moodle/phpunit.xml" --testsuite "${component}_testsuite" --testdox --colors $EXTRA $ADDITIONAL_STUFF
        fi
