name: Moodle CI

on:
  pull_request:
    branches:
      - main
      - master
      - MOODLE_*_STABLE
  push:
    branches:
      - main
      - master
      - MOODLE_*_STABLE
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  ci:
    uses: praxisdigital/moodle-test-action/.github/workflows/ci.yml@master
    secrets: inherit
    with:
      dependencies: >-
        [
          "praxisdigital/local_pxsdk@master",
          "praxisdigital/local_pxllogger@MOODLE_42_STABLE",
          "praxisdigital/local__praxislib@MOODLE_42_STABLE",
          "praxisdigital/local__wspraxis@MOODLE_42_STABLE",
          "praxisdigital/enrol__praxisintegration@MOODLE_42_STABLE"
        ]
