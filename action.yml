name: moodle-test-action
description: 'Run PHPUnit tests for Moodle'

inputs:
  plugin:
    description: 'Plugin name (component name). Optional override; if empty, it will be auto-detected from version.php.'
    required: false
    default: ''
  plugin-path:
    description: 'Plugin path'
    required: true
  php:
    description: 'PHP version'
    required: true
  moodle:
    description: 'Moodle version (branch, tag or commit)'
    required: true
  moodle_repository:
    description: 'Moodle repository, e.g. moodle/moodle'
    required: false
    default: 'moodle/moodle'
  os:
    description: 'Operating system'
    required: true
  additional_phpunit_arguments:
    description: 'Additonal arguments to pass to phpunit'
    required: false
    default: ''
  org:
    description: 'Organization'
    required: false
    default: 'praxisdigital'
  dependencies:
    description: >
      Plugin dependencies.
      Format: org/repo@ref
      Example: |
        praxisdigital/assignsubmission_pxaiwriter@master
        praxisdigital/mod_smartlink@MOODLE_42_STABLE
    required: false
    default: ''
  dbtype:
    description: 'Database type (mysqli, pgsql, sqlsrv)'
    required: false
    default: 'mysqli'
  experimental:
    description: 'Is experimental run'
    required: false
    default: 'false'
  PRIVATE_REPO_TOKEN:
    description: 'Token for private repositories'
    required: true
  fail_on_empty_test_suite:
    description: 'Fail the job if PHPUnit executes no tests'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setting up DB mysql
      if: ${{ inputs.dbtype == 'mysqli' }}
      uses: praxisdigital/mysql-action@tmpfs-and-docker-patch
      with:
        collation server: utf8mb4_danish_ci
        mysql version: 8
        mysql database: test
        mysql user: test
        mysql password: test
        use tmpfs: true

    - name: Setting up DB pgsql
      if: ${{ inputs.dbtype == 'pgsql' }}
      uses: m4nu56/postgresql-action@v1
      with:
        postgresql version: 16
        postgresql db: test
        postgresql user: test
        postgresql password: test

    - name: Setting up DB mssql
      if: ${{ inputs.dbtype == 'sqlsrv' }}
      uses: praxisdigital/setup-mssql-server@main
      with:
        version: 2022
        user: test
        password: test
        database: test

    - name: Setting up PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php }}
        coverage: xdebug
        ini-values: 'max_input_vars=5000'
        extensions: sqlsrv, pdo_sqlsrv

    - name: Download & Setup MSSQL ODBC driver for PHP
      if: ${{ inputs.dbtype == 'sqlsrv' }}
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php }}
      run: |
        if ! [[ "18.04 20.04 22.04 24.04 24.10" == *"$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)"* ]];
        then
            echo "Ubuntu $(grep VERSION_ID /etc/os-release | cut -d '"' -f 2) is not currently supported.";
            exit;
        fi

        # Download the package to configure the Microsoft repo
        curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)/packages-microsoft-prod.deb
        # Install the package
        sudo dpkg -i packages-microsoft-prod.deb
        # Delete the file
        rm packages-microsoft-prod.deb

        # Install the driver
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
        echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> ~/.bashrc
        source ~/.bashrc
        sudo apt-get install -y unixodbc-dev
        sudo phpenmod -v $PHP_VERSION sqlsrv pdo_sqlsrv
        php -m | grep -q 'sqlsrv' && echo "sqlsrv extension installed"
        php -m | grep -q 'pdo_sqlsrv' && echo "pdo_sqlsrv extension installed"

    - name: Checking out code from ${{ inputs.moodle_repository }}
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.moodle_repository }}
        ref: ${{ inputs.moodle }}
        path: ${{ github.workspace }}/moodle
        token: ${{ inputs.PRIVATE_REPO_TOKEN }}

    - name: Setting up Moodle dataroot & config
      shell: bash
      env:
        dbtype: ${{ inputs.dbtype }}
      run: |
        echo "pathtophp=$(which php)" >> $GITHUB_ENV # Inject installed pathtophp to env. The template config needs it.
        touch $GITHUB_WORKSPACE/moodle/config.php
        mkdir -p $GITHUB_WORKSPACE/moodledata
        mkdir -p $GITHUB_WORKSPACE/moodledata/localcachedir
        echo '<?php' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'unset($CFG);' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'global $CFG;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG = new stdClass();' >> $GITHUB_WORKSPACE/moodle/config.php
        echo "\$CFG->dbtype   = '$dbtype';" >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dblibrary = "native";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dbhost    = "127.0.0.1";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dbname    = "test";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dbuser    = "test";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dbpass    = "test";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->prefix    = "m_";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->dboptions = [' >> $GITHUB_WORKSPACE/moodle/config.php
        test "$dbtype" = "mysqli" && echo '    "dbcollation" => "utf8mb4_unicode_ci",' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '    "extrainfo" => [' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '        "TrustServerCertificate" => true' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '    ]' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '];' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$host = "localhost";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->wwwroot   = "http://{$host}";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo "\$CFG->dataroot  = '$GITHUB_WORKSPACE/moodledata';" >> $GITHUB_WORKSPACE/moodle/config.php
        echo "\$CFG->localcachedir  = '$GITHUB_WORKSPACE/moodledata/localcachedir';" >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->admin     = "admin";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->directorypermissions = 0777;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->debug = (E_ALL);' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->debugdisplay = 1;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->debugstringids = 1;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->perfdebug = 15;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->debugpageinfo = 1;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->allowthemechangeonurl = 1;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->passwordpolicy = 0;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->cronclionly = 0;' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->pathtophp = getenv("pathtophp");' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->phpunit_dataroot  = realpath(dirname(__DIR__)) . "/phpunitdata";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo '$CFG->phpunit_prefix = "t_";' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'define("TEST_EXTERNAL_FILES_HTTP_URL", "http://$host:8080");' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'define("TEST_EXTERNAL_FILES_HTTPS_URL", "http://$host:8080");' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'define("TEST_SESSION_REDIS_HOST", $host);' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'define("TEST_CACHESTORE_REDIS_TESTSERVERS", $host);' >> $GITHUB_WORKSPACE/moodle/config.php
        echo 'require_once(__DIR__ . "/lib/setup.php");' >> $GITHUB_WORKSPACE/moodle/config.php

    - name: Checking out dependencies
      if: ${{ inputs.dependencies != '' }}
      shell: bash
      run: |
        # dependencies are in the format of org/repo@ref
        dependencies="${{ inputs.dependencies }}"
        if [[ -z $dependencies ]]; then
          echo "No dependencies to checkout"
          exit 0
        fi
        for dep in $dependencies; do
          repo=$(echo $dep | cut -d@ -f1)
          ref=$(echo $dep | cut -d@ -f2)
          url="https://github.com/${repo}.git"

          # Convert to correct URL if private repo
          if [[ $repo == ${{ inputs.org }}/* ]]; then
            printf "Checking out ${repo}@${ref} from github.com\n"
            url="https://oauth2:${{ inputs.PRIVATE_REPO_TOKEN }}@github.com/${repo}.git"
          else
            printf "Checking out (public) ${repo}@${ref} from github.com\n"
          fi

          # Get component name from version.php by cloning to a temp dir
          echo "Auto determining component name for repo: $repo ..."
          tmpdir=$GITHUB_WORKSPACE/tmp
          mkdir -p $tmpdir
          git clone --quiet $url $tmpdir/$repo
          component=$(cat $tmpdir/$repo/version.php | sed -En 's/\s*\$plugin->component\s*=\s*(.*)\s*;/\1/p' | cut -d"'" -f2 | cut -d'"' -f2)
          rm -rf $tmpdir/$repo
          echo "Auto determined component name: $component"

          # Calculate the path to clone to inside moodle based on component name
          echo "Auto determining path for component: $component ..."
          path=$(php -r "CONST CLI_SCRIPT = true; require_once '$GITHUB_WORKSPACE/moodle/config.php'; if (file_exists('$GITHUB_WORKSPACE/moodle/public/lib/classes/component.php')) { require_once '$GITHUB_WORKSPACE/moodle/public/lib/classes/component.php'; } else { require_once '$GITHUB_WORKSPACE/moodle/lib/classes/component.php'; } class_exists('core\\component') === false && class_alias('core_component', '\\core\\component'); use core\\component; [\$plugin_type, \$name] = component::normalize_component('$component'); \$plugin_types = component::get_plugin_types();echo empty(\$plugin_types[\$plugin_type]) ? '' : \$plugin_types[\$plugin_type] . '/' . \$name;")
          echo "Auto determined path: $path"

          echo "Cloning $repo@$ref using $url to $path ..."
          git clone $url $path
          git -C $path checkout $ref
        done

    - name: Resolving plugin path for Moodle layout
      shell: bash
      run: |
        # Moodle 5.0+ moved the codebase under public/. Mirror that here so the
        # plugin under test ends up where core\component will actually find it.
        if [ -d "$GITHUB_WORKSPACE/moodle/public" ]; then
          echo "resolved_plugin_path=public/${{ inputs.plugin-path }}" >> $GITHUB_ENV
        else
          echo "resolved_plugin_path=${{ inputs.plugin-path }}" >> $GITHUB_ENV
        fi

    - name: Check out code from ${{ github.repository }}
      uses: actions/checkout@v6
      with:
        path: ${{ github.workspace }}/moodle/${{ env.resolved_plugin_path }}
        ref: ${{ github.ref }}

    - name: Resolving plugin component from version.php
      shell: bash
      env:
        plugin_override: ${{ inputs.plugin }}
      run: |
        VERSION_FILE="$GITHUB_WORKSPACE/moodle/${{ env.resolved_plugin_path }}/version.php"
        if [ ! -f "$VERSION_FILE" ]; then
          echo "version.php not found at $VERSION_FILE"
          exit 1
        fi
        component=$(sed -En 's/\s*\$plugin->component\s*=\s*(.*)\s*;/\1/p' "$VERSION_FILE" | cut -d"'" -f2 | cut -d'"' -f2)
        if [ -z "$component" ]; then
          echo "Failed to determine component name from $VERSION_FILE"
          exit 1
        fi
        echo "Auto-detected component from version.php: $component"

        if [ -n "$plugin_override" ]; then
          echo "Overriding auto-detected component with inputs.plugin: $plugin_override"
          component="$plugin_override"
        fi

        echo "Final component: $component"
        echo "component=$component" >> $GITHUB_ENV

    - name: Setting up PHPUnit
      shell: bash
      run: |
        echo "pathtophp=$(which php)" >> $GITHUB_ENV # Inject installed pathtophp to env. The template config needs it.
        mkdir $GITHUB_WORKSPACE/../moodledata
        sudo locale-gen en_AU.UTF-8
        test -f $GITHUB_WORKSPACE/moodle/public/admin/tool/phpunit/cli/init.php && php $GITHUB_WORKSPACE/moodle/public/admin/tool/phpunit/cli/init.php --no-composer-self-update || php $GITHUB_WORKSPACE/moodle/admin/tool/phpunit/cli/init.php --no-composer-self-update

    - name: Running PHPUnit tests
      shell: bash
      env:
        component: ${{ env.component }}
        ADDITIONAL_STUFF: ${{ inputs.additional_phpunit_arguments }}
        PLUGIN_PATH: ${{ env.resolved_plugin_path }}
        FAIL_ON_EMPTY: ${{ inputs.fail_on_empty_test_suite }}
        XDEBUG_MODE: coverage
      run: |
        PHPUNIT="$GITHUB_WORKSPACE/moodle/vendor/bin/phpunit"
        PLUGIN_FULL="$GITHUB_WORKSPACE/moodle/$PLUGIN_PATH"
        COVERAGE_DIR="$GITHUB_WORKSPACE/coverage"
        EXTRA=""
        if [ "$FAIL_ON_EMPTY" = "true" ]; then
          EXTRA="--fail-on-empty-test-suite"
        fi
        mkdir -p "$COVERAGE_DIR"
        COVERAGE_ARGS="--coverage-clover $COVERAGE_DIR/clover.xml --coverage-text $COVERAGE_DIR/summary.txt"
        if [ -f "$PLUGIN_FULL/phpunit.xml" ]; then
          echo "Running phpunit on ${component} with plugin phpunit.xml"
          "$PHPUNIT" -c "$PLUGIN_FULL/phpunit.xml" --testdox --colors $EXTRA $COVERAGE_ARGS $ADDITIONAL_STUFF
        else
          echo "Running phpunit on ${component} with testsuite from Moodle phpunit.xml"
          "$PHPUNIT" -c "$GITHUB_WORKSPACE/moodle/phpunit.xml" --testsuite "${component}_testsuite" --testdox --colors $EXTRA $COVERAGE_ARGS $ADDITIONAL_STUFF
        fi

    - name: Resolving coverage artifact name
      if: ${{ always() }}
      shell: bash
      env:
        component: ${{ env.component }}
        moodle: ${{ inputs.moodle }}
        php: ${{ inputs.php }}
        dbtype: ${{ inputs.dbtype }}
        os: ${{ inputs.os }}
        moodle_repository: ${{ inputs.moodle_repository }}
      run: |
        raw="coverage-${component}-${moodle}-php${php}-${dbtype}-${os}-${moodle_repository}"
        artifact_name=$(printf '%s' "$raw" | tr '/:@ ' '----' | tr -cd 'A-Za-z0-9_.-')
        echo "coverage_artifact_name=$artifact_name" >> "$GITHUB_ENV"

    - name: Uploading coverage artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.coverage_artifact_name }}
        path: ${{ github.workspace }}/coverage
        if-no-files-found: warn

    - name: Finding base branch coverage artifact
      if: ${{ always() && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        ARTIFACT_NAME: ${{ env.coverage_artifact_name }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          try {
            const {owner, repo} = context.repo;
            const baseBranch = context.payload.pull_request.base.ref;
            const artifactName = process.env.ARTIFACT_NAME;

            const currentRun = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId,
            });

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: currentRun.data.workflow_id,
              branch: baseBranch,
              status: 'success',
              per_page: 20,
            });

            let match = null;
            for (const run of runs) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.find((item) => item.name === artifactName && !item.expired);
              if (artifact) {
                match = {run, artifact};
                break;
              }
            }

            if (!match) {
              fs.appendFileSync(process.env.GITHUB_ENV, 'base_coverage_run_id=\n');
              fs.appendFileSync(process.env.GITHUB_ENV, 'base_coverage_artifact_found=false\n');
              core.notice(`No matching coverage artifact named ${artifactName} was found on ${baseBranch}.`);
              return;
            }

            fs.appendFileSync(process.env.GITHUB_ENV, `base_coverage_run_id=${match.run.id}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, 'base_coverage_artifact_found=true\n');
            core.notice(`Found ${artifactName} in run ${match.run.id} on ${baseBranch}.`);
          } catch (error) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'base_coverage_run_id=\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'base_coverage_artifact_found=false\n');
            core.warning(`Could not find base branch coverage artifact: ${error.message}`);
          }

    - name: Downloading base branch coverage artifact
      if: ${{ always() && github.event_name == 'pull_request' && env.base_coverage_artifact_found == 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.coverage_artifact_name }}
        path: ${{ github.workspace }}/base-coverage
        run-id: ${{ env.base_coverage_run_id }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}

    - name: Commenting PR coverage diff
      if: ${{ always() && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        ARTIFACT_NAME: ${{ env.coverage_artifact_name }}
        BASE_ARTIFACT_FOUND: ${{ env.base_coverage_artifact_found }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const {owner, repo} = context.repo;
          const issue_number = context.payload.pull_request.number;
          const marker = `<!-- moodle-test-action-coverage:${process.env.ARTIFACT_NAME} -->`;

          function decodeXml(value) {
            return value
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&amp;/g, '&');
          }

          function attrs(tag) {
            const result = {};
            for (const match of tag.matchAll(/([A-Za-z_:][A-Za-z0-9_.:-]*)="([^"]*)"/g)) {
              result[match[1]] = decodeXml(match[2]);
            }
            return result;
          }

          function pct(covered, total) {
            return total > 0 ? (covered / total) * 100 : 0;
          }

          function parseClover(file) {
            const xml = fs.readFileSync(file, 'utf8');
            const projectMatch = xml.match(/<project\b[^>]*>/);
            if (!projectMatch) {
              throw new Error(`Could not find project metrics in ${file}`);
            }
            const projectBlock = xml.slice(projectMatch.index, xml.indexOf('</project>', projectMatch.index));
            const metricsMatches = [...projectBlock.matchAll(/<metrics\b[^>]*>/g)];
            if (metricsMatches.length === 0) {
              throw new Error(`Could not find coverage metrics in ${file}`);
            }

            const projectMetrics = attrs(metricsMatches[metricsMatches.length - 1][0]);
            const total = Number(projectMetrics.statements || 0);
            const covered = Number(projectMetrics.coveredstatements || 0);
            const files = {};

            for (const match of xml.matchAll(/<file\b[^>]*name="[^"]*"[^>]*>[\s\S]*?<\/file>/g)) {
              const block = match[0];
              const fileTag = block.match(/<file\b[^>]*>/)[0];
              const name = attrs(fileTag).name;
              const metrics = block.match(/<metrics\b[^>]*>/g);
              if (!name || !metrics || metrics.length === 0) {
                continue;
              }
              const fileMetrics = attrs(metrics[metrics.length - 1]);
              const fileTotal = Number(fileMetrics.statements || 0);
              const fileCovered = Number(fileMetrics.coveredstatements || 0);
              const moodleIndex = name.indexOf('/moodle/');
              const relativeName = moodleIndex >= 0 ? name.slice(moodleIndex + '/moodle/'.length) : name;
              files[relativeName] = {
                total: fileTotal,
                covered: fileCovered,
                percent: pct(fileCovered, fileTotal),
              };
            }

            return {total, covered, percent: pct(covered, total), files};
          }

          function fmt(value) {
            return `${value.toFixed(2)}%`;
          }

          function delta(value) {
            const sign = value > 0 ? '+' : '';
            return `${sign}${value.toFixed(2)}%`;
          }

          function cell(value) {
            return value ? fmt(value.percent) : 'n/a';
          }

          function buildDiff(base, pr) {
            const rows = [];
            const names = new Set([...Object.keys(base.files), ...Object.keys(pr.files)]);
            for (const name of names) {
              const before = base.files[name];
              const after = pr.files[name];
              const change = before && after ? after.percent - before.percent : null;
              rows.push({name, before, after, change});
            }

            rows.sort((a, b) => {
              if (a.change === null && b.change === null) return a.name.localeCompare(b.name);
              if (a.change === null) return 1;
              if (b.change === null) return -1;
              return a.change - b.change;
            });

            const lines = [
              marker,
              '## Code Coverage Diff',
              '',
              `Artifact: \`${process.env.ARTIFACT_NAME}\``,
              '',
              '| Total | Base | PR | Diff |',
              '| --- | ---: | ---: | ---: |',
              `| Statements | ${fmt(base.percent)} (${base.covered}/${base.total}) | ${fmt(pr.percent)} (${pr.covered}/${pr.total}) | ${delta(pr.percent - base.percent)} |`,
              '',
              '| File | Base | PR | Diff |',
              '| --- | ---: | ---: | ---: |',
            ];

            const shown = rows.slice(0, 50);
            for (const row of shown) {
              const diff = row.change === null ? (row.before ? 'removed' : 'added') : delta(row.change);
              lines.push(`| \`${row.name}\` | ${cell(row.before)} | ${cell(row.after)} | ${diff} |`);
            }

            if (rows.length > shown.length) {
              lines.push(`| ... | ... | ... | ${rows.length - shown.length} more files omitted |`);
            }

            return lines.join('\n');
          }

          function reason(message) {
            return [
              marker,
              '## Code Coverage Diff',
              '',
              `Artifact: \`${process.env.ARTIFACT_NAME}\``,
              '',
              message,
            ].join('\n');
          }

          const prCoverage = path.join(process.env.GITHUB_WORKSPACE, 'coverage', 'clover.xml');
          const baseCoverage = path.join(process.env.GITHUB_WORKSPACE, 'base-coverage', 'clover.xml');
          let body;

          try {
            if (!fs.existsSync(prCoverage)) {
              body = reason('No coverage diff is available because this PR run did not generate a `clover.xml` coverage report.');
            } else if (process.env.BASE_ARTIFACT_FOUND !== 'true') {
              body = reason('No coverage diff is available because no matching base-branch coverage artifact was found, or the workflow token could not read artifacts. Run this workflow on the base branch first and ensure the workflow has `actions: read`, then rerun the PR workflow.');
            } else if (!fs.existsSync(baseCoverage)) {
              body = reason('No coverage diff is available because the matching base-branch artifact could not be downloaded or did not contain `clover.xml`.');
            } else {
              body = buildDiff(parseClover(baseCoverage), parseClover(prCoverage));
            }
          } catch (error) {
            body = reason(`No coverage diff is available because coverage parsing failed: ${error.message}`);
          }

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
          } else {
            await github.rest.issues.createComment({owner, repo, issue_number, body});
          }
