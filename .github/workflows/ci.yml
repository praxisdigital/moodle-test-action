name: Moodle plugin CI

on:
  workflow_call:
    inputs:
      automatic:
        description: 'Use the central catalogue and plugin version.php for matrix generation; ignore legacy matrix overrides'
        required: false
        type: string
        default: 'false'
      run_phpunit:
        description: 'Run PHPUnit tests'
        required: false
        type: string
        default: 'true'
      run_behat:
        description: 'Run Behat tests when feature files are present'
        required: false
        type: string
        default: 'true'
      behat_on_pull_request:
        description: 'Run Behat automatically on pull_request events instead of only on #behat comments, workflow_dispatch, or stable branch pushes'
        required: false
        type: string
        default: 'false'
      plugin_component:
        description: 'Moodle plugin component name'
        required: false
        type: string
        default: ''
      plugin_path:
        description: 'Moodle plugin install path'
        required: false
        type: string
        default: ''
      php_versions:
        description: 'JSON PHP versions; in automatic mode, restricts each target to the requested supported versions'
        required: false
        type: string
        default: ''
      moodle_versions:
        description: 'Optional JSON Moodle ref override for one-off plugin versions'
        required: false
        type: string
        default: ''
      moodle_repositories:
        description: 'Optional JSON core repository override'
        required: false
        type: string
        default: ''
      os:
        description: 'Optional JSON runner label override'
        required: false
        type: string
        default: ''
      db_types:
        description: 'JSON array of database types for PHPUnit matrix'
        required: false
        type: string
        default: ''
      experimental:
        description: 'Optional JSON experimental flag override'
        required: false
        type: string
        default: ''
      exclude_matrix:
        description: 'Optional JSON array of matrix exclusions'
        required: false
        type: string
        default: ''
      dependencies:
        description: 'JSON array of plugin dependencies in org/repo@ref format'
        required: false
        type: string
        default: ''
      org:
        description: 'GitHub organization used for private dependency detection'
        required: false
        type: string
        default: ''
      additional_phpunit_arguments:
        description: 'Additional arguments to pass to PHPUnit'
        required: false
        type: string
        default: ''
      fail_on_empty_test_suite:
        description: 'Fail the job if PHPUnit executes no tests'
        required: false
        type: string
        default: 'true'
      additional_behat_arguments:
        description: 'Additional arguments to pass to Behat'
        required: false
        type: string
        default: ''
      behat_increase_timeout:
        description: 'Multiplier for Moodle Behat timeouts; use 0 to disable'
        required: false
        type: string
        default: '2'
      behat_step_timeout_minutes:
        description: 'Maximum minutes allowed for the Behat runner step'
        required: false
        type: string
        default: '45'
      post_no_tests_comment:
        description: 'Post a PR comment when Behat is requested but no Behat feature files exist'
        required: false
        type: string
        default: ''
      post_commands_comment:
        description: 'Post a PR comment on newly opened pull requests explaining available CI commands'
        required: false
        type: string
        default: 'true'
      pull_request_number:
        description: 'Optional pull request number to test'
        required: false
        type: string
        default: ''
      action_ref:
        description: 'moodle-test-action ref used for local subactions'
        required: false
        type: string
        default: 'master'
    secrets:
      MOODLE_CI_APP_ID:
        description: 'GitHub App ID for private dependency checkout, PR comments, and commit statuses'
        required: false
      MOODLE_CI_APP_PRIVATE_KEY:
        description: 'GitHub App private key for private dependency checkout, PR comments, and commit statuses'
        required: false
permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      MOODLE_CI_APP_ID_VALUE: ${{ secrets.MOODLE_CI_APP_ID || vars.MOODLE_CI_APP_ID }}
      HAS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MOODLE_CI_APP_PRIVATE_KEY != '' }}
    outputs:
      should_run: ${{ steps.config.outputs.should_run }}
      skip_reason: ${{ steps.config.outputs.skip_reason }}
      is_behat_comment: ${{ steps.command.outputs.is_behat_comment }}
      is_stable_push: ${{ steps.command.outputs.is_stable_push }}
      pull_request_number: ${{ steps.command.outputs.pull_request_number }}
      pull_request_head_sha: ${{ steps.command.outputs.pull_request_head_sha }}
      behat_tags: ${{ steps.command.outputs.behat_tags }}
      behat_tag_arguments: ${{ steps.command.outputs.behat_tag_arguments }}
      checkout_ref: ${{ steps.plugin-sha.outputs.sha }}
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
      has_tests: ${{ steps.matrix.outputs.has_tests }}
    steps:
      - name: Validate GitHub App configuration
        id: app-config
        shell: bash
        run: |
          if [ -z "$MOODLE_CI_APP_ID_VALUE" ] && [ "$HAS_GITHUB_APP_PRIVATE_KEY" != "true" ]; then
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$MOODLE_CI_APP_ID_VALUE" ] || [ "$HAS_GITHUB_APP_PRIVATE_KEY" != "true" ]; then
            echo "::warning::Both MOODLE_CI_APP_ID and MOODLE_CI_APP_PRIVATE_KEY are required to use the GitHub App token. Falling back to GITHUB_TOKEN."
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$MOODLE_CI_APP_ID_VALUE" =~ ^[0-9]+$ ]]; then
            echo "::error::MOODLE_CI_APP_ID must be the numeric GitHub App ID, not the Client ID, app name, or installation ID."
            exit 1
          fi

          echo "has_app=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        if: ${{ steps.app-config.outputs.has_app == 'true' }}
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ env.MOODLE_CI_APP_ID_VALUE }}
          private-key: ${{ secrets.MOODLE_CI_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Warn about GitHub App token failure
        if: ${{ steps.app-config.outputs.has_app == 'true' && steps.app-token.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::Could not create GitHub App token; falling back to GITHUB_TOKEN."

      - name: Warn about GitHub App private key variable
        if: ${{ steps.app-config.outputs.has_app != 'true' && vars.MOODLE_CI_APP_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          echo "::warning::MOODLE_CI_APP_PRIVATE_KEY must be configured as an Actions secret, not an Actions variable."

      - name: Check out moodle-test-action subactions
        uses: actions/checkout@v6
        with:
          repository: praxisdigital/moodle-test-action
          ref: ${{ inputs.action_ref }}
          path: .moodle-test-action
          persist-credentials: false

      - name: Resolve CI configuration
        id: config
        uses: actions/github-script@v8
        env:
          AUTOMATIC: ${{ inputs.automatic }}
          PHP_VERSIONS: ${{ inputs.php_versions || (inputs.automatic != 'true' && vars.MOODLE_SUPPORTED_PHP_VERSIONS) || '' }}
          MOODLE_VERSIONS: ${{ inputs.moodle_versions || vars.MOODLE_SUPPORTED_VERSIONS || '' }}
          MOODLE_REPOSITORIES: ${{ inputs.moodle_repositories || vars.MOODLE_REPOS || '' }}
          OS: ${{ inputs.os || vars.MOODLE_OS || '' }}
          DB_TYPES: ${{ inputs.db_types || vars.MOODLE_DB_TYPES || '' }}
          EXPERIMENTAL: ${{ inputs.experimental || vars.MOODLE_EXPERIMENTAL || '' }}
          EXCLUDE_MATRIX: ${{ inputs.exclude_matrix || vars.MOODLE_EXCLUDE_MATRIX || '' }}
          DEPENDENCIES: ${{ inputs.dependencies || vars.MOODLE_PLUGIN_DEPENDENCIES || '' }}
        with:
          script: |
            const parseArray = (name, value, fallback) => {
              const raw = String(value || '').trim();
              if (!raw) {
                return fallback;
              }

              try {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length > 0) {
                  return parsed;
                }
                core.warning(`${name} must be a non-empty JSON array. Falling back to ${JSON.stringify(fallback)}.`);
              } catch (error) {
                core.warning(`${name} is not valid JSON: ${error.message}. Falling back to ${JSON.stringify(fallback)}.`);
              }
              return fallback;
            };

            const parseDependencies = value => {
              const raw = String(value || '').trim();
              if (!raw) {
                return [];
              }

              const normalize = dependencies => [...new Set(dependencies.map(dep => String(dep).trim()).filter(Boolean))];

              try {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                  return normalize(parsed);
                }
                core.warning('MOODLE_PLUGIN_DEPENDENCIES must be a JSON array or whitespace-separated org/repo@ref list. Treating it as empty.');
                return [];
              } catch (_) {
                const matches = raw.match(/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+@[^\s"',\]]+/g);
                if (matches) {
                  return normalize(matches);
                }
                return [];
              }
            };

            const parseOptionalArray = (name, value) => {
              if (!String(value || '').trim()) return [];
              try {
                const parsed = JSON.parse(value);
                if (Array.isArray(parsed)) return parsed;
              } catch (error) {
                core.warning(`${name} is not valid JSON: ${error.message}. Falling back to [].`);
                return [];
              }
              core.warning(`${name} must be a JSON array. Falling back to [].`);
              return [];
            };

            const parsePhpFilter = value => {
              if (!String(value || '').trim()) return [];
              let parsed;
              try {
                parsed = JSON.parse(value);
              } catch (error) {
                throw new Error(`MOODLE_SUPPORTED_PHP_VERSIONS must be a JSON array: ${error.message}`);
              }
              if (!Array.isArray(parsed) || !parsed.length || parsed.some(php => typeof php !== 'string' || !/^\d+\.\d+$/.test(php))) {
                throw new Error('MOODLE_SUPPORTED_PHP_VERSIONS must be a non-empty JSON array of PHP versions such as ["8.3","8.4"]');
              }
              return parsed;
            };

            if (!['true', 'false'].includes(process.env.AUTOMATIC)) {
              throw new Error("automatic must be 'true' or 'false'");
            }
            const automatic = process.env.AUTOMATIC === 'true';

            const resolved = {
              php_versions: automatic ? parsePhpFilter(process.env.PHP_VERSIONS) : parseArray('MOODLE_SUPPORTED_PHP_VERSIONS', process.env.PHP_VERSIONS, ['8.4']),
              moodle_versions: automatic ? [] : parseArray('MOODLE_SUPPORTED_VERSIONS', process.env.MOODLE_VERSIONS, ['MOODLE_502_STABLE']),
              moodle_repositories: automatic ? [] : parseArray('MOODLE_REPOS', process.env.MOODLE_REPOSITORIES, ['moodle/moodle']),
              os: automatic ? [] : parseArray('MOODLE_OS', process.env.OS, ['ubuntu-latest']),
              db_types: parseArray('MOODLE_DB_TYPES', process.env.DB_TYPES, ['mysqli']),
              experimental: automatic ? [] : parseArray('MOODLE_EXPERIMENTAL', process.env.EXPERIMENTAL, [false]),
              exclude_matrix: automatic ? [] : parseOptionalArray('MOODLE_EXCLUDE_MATRIX', process.env.EXCLUDE_MATRIX),
              dependencies: parseDependencies(process.env.DEPENDENCIES),
            };
            if (automatic) {
              core.notice('Automatic matrix enabled: ignoring legacy matrix variables. Explicit php_versions filters catalogue ranges; database, dependency and suite settings remain active.');
            }
            if (resolved.db_types.some(db => !['mysqli', 'pgsql', 'sqlsrv'].includes(db))) {
              throw new Error('MOODLE_DB_TYPES must contain only mysqli, pgsql or sqlsrv');
            }

            let shouldRun = true;
            let skipReason = '';

            if (context.eventName === 'push' && context.ref?.startsWith('refs/heads/')) {
              const branch = context.ref.replace('refs/heads/', '');
              const { owner, repo } = context.repo;
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branch}`,
                per_page: 100,
              });

              if (pulls.length > 0) {
                shouldRun = false;
                skipReason = `Skipping push run because branch ${branch} already has open pull request #${pulls[0].number}.`;
                core.notice(skipReason);
              }
            }

            core.info(`Resolved ${resolved.db_types.length} database type(s); ${automatic ? 'automatic catalogue' : 'legacy variables'} matrix mode.`);

            core.setOutput('should_run', String(shouldRun));
            core.setOutput('skip_reason', skipReason);
            core.setOutput('automatic', String(automatic));
            core.setOutput('db_types', JSON.stringify(resolved.db_types));
            core.setOutput('dependencies', resolved.dependencies.join(' '));
            for (const name of ['php_versions', 'moodle_versions', 'moodle_repositories', 'os', 'experimental', 'exclude_matrix']) {
              core.setOutput(name, JSON.stringify(resolved[name]));
            }

      - name: Parse comment command
        id: command
        uses: ./.moodle-test-action/comment-parser

      - name: Comment available CI commands
        if: ${{ inputs.post_commands_comment == 'true' && github.event_name == 'pull_request' && github.event.action == 'opened' }}
        uses: actions/github-script@v8
        continue-on-error: true
        env:
          TOKEN_SOURCE: ${{ steps.app-token.outputs.token != '' && 'github-app' || 'github-token' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- moodle-test-action:commands -->';
            const body = [
              marker,
              'Available CI commands: <code>#<!-- -->behat</code>, optionally with one or more tags, for example <code>#<!-- -->behat @javascript @block_example</code>.',
            ].join('\n');

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find(comment => comment.body?.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Could not post Moodle CI command helper comment using ${process.env.TOKEN_SOURCE}; continuing without it.`);
              } else {
                throw error;
              }
            }

      - name: Resolve plugin checkout ref and branch
        id: target
        uses: actions/github-script@v8
        env:
          EXPLICIT_PR: ${{ inputs.pull_request_number }}
        with:
          script: |
            let number = context.payload.pull_request?.number ||
              (context.payload.issue?.pull_request ? context.payload.issue.number : '') ||
              process.env.EXPLICIT_PR;
            if (number) {
              number = Number(number);
              if (!Number.isInteger(number) || number < 1) throw new Error('Invalid pull request number');
              const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              core.setOutput('checkout_ref', `refs/pull/${number}/merge`);
              core.setOutput('branch', pull.base.ref);
            } else {
              if (context.eventName === 'issue_comment') {
                core.setOutput('checkout_ref', context.sha);
                core.setOutput('branch', context.ref.replace('refs/heads/', ''));
              } else {
                core.setOutput('checkout_ref', context.sha);
                core.setOutput('branch', context.ref.startsWith('refs/heads/') ? context.ref.slice(11) : context.ref);
              }
            }

      - name: Check out plugin revision for matrix resolution
        if: ${{ github.event_name != 'issue_comment' || steps.command.outputs.is_behat_comment == 'true' }}
        id: plugin-checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          path: plugin-src
          persist-credentials: false

      - name: Pin tested plugin revision
        id: plugin-sha
        if: ${{ steps.plugin-checkout.outcome == 'success' }}
        shell: bash
        run: echo "sha=$(git -C plugin-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build test matrix
        id: matrix
        uses: actions/github-script@v8
        env:
          DB_TYPES: ${{ steps.config.outputs.db_types }}
          AUTOMATIC: ${{ steps.config.outputs.automatic }}
          PHP_VERSIONS: ${{ steps.config.outputs.php_versions }}
          MOODLE_VERSIONS: ${{ steps.config.outputs.moodle_versions }}
          MOODLE_REPOSITORIES: ${{ steps.config.outputs.moodle_repositories }}
          OS: ${{ steps.config.outputs.os }}
          EXPERIMENTAL: ${{ steps.config.outputs.experimental }}
          EXCLUDE_MATRIX: ${{ steps.config.outputs.exclude_matrix }}
          DEPENDENCIES: ${{ steps.config.outputs.dependencies }}
          RUN_PHPUNIT: ${{ inputs.run_phpunit }}
          RUN_BEHAT: ${{ inputs.run_behat }}
          BEHAT_ON_PULL_REQUEST: ${{ inputs.behat_on_pull_request }}
          IS_STABLE_PUSH: ${{ steps.command.outputs.is_stable_push }}
          IS_BEHAT_COMMENT: ${{ steps.command.outputs.is_behat_comment }}
          BASE_BRANCH: ${{ steps.target.outputs.branch }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          script: |
            const eventName = context.eventName;
            const runPhpunit = process.env.RUN_PHPUNIT === 'true' && ['pull_request', 'push', 'workflow_dispatch'].includes(eventName);
            const runBehat = process.env.RUN_BEHAT === 'true' && (
              eventName === 'workflow_dispatch' ||
              process.env.IS_STABLE_PUSH === 'true' ||
              (eventName === 'pull_request' && process.env.BEHAT_ON_PULL_REQUEST === 'true') ||
              process.env.IS_BEHAT_COMMENT === 'true'
            );

            const suites = [runPhpunit && 'phpunit', runBehat && 'behat'].filter(Boolean);
            let rows = [];
            if (suites.length) {
              const resolver = require(`${process.env.GITHUB_WORKSPACE}/.moodle-test-action/.github/scripts/resolve-matrix.js`);
              const dbTypes = JSON.parse(process.env.DB_TYPES);
              const dependencies = process.env.DEPENDENCIES || '';
              let result;
              if (process.env.AUTOMATIC === 'true') {
                const appGithub = process.env.APP_TOKEN ? require('@actions/github').getOctokit(process.env.APP_TOKEN) : null;
                result = await resolver.resolve({ github, appGithub, context,
                  branch: process.env.BASE_BRANCH, dbTypes, suites, dependencies,
                  phpVersions: JSON.parse(process.env.PHP_VERSIONS),
                  cataloguePath: `${process.env.GITHUB_WORKSPACE}/.moodle-test-action/.github/moodle-test-targets.json`,
                  versionPath: `${process.env.GITHUB_WORKSPACE}/plugin-src/version.php`,
                });
              } else {
                result = resolver.legacyRows({
                  phpVersions: JSON.parse(process.env.PHP_VERSIONS),
                  moodleVersions: JSON.parse(process.env.MOODLE_VERSIONS),
                  repositories: JSON.parse(process.env.MOODLE_REPOSITORIES),
                  os: JSON.parse(process.env.OS),
                  dbTypes, experimental: JSON.parse(process.env.EXPERIMENTAL),
                  excludes: JSON.parse(process.env.EXCLUDE_MATRIX), suites, dependencies,
                });
              }
              rows = result.rows;
              core.summary.addHeading('Resolved Moodle CI targets');
              core.summary.addCodeBlock(result.description);
              await core.summary.write();
            }
            core.info(`Generated ${rows.length} test matrix row(s).`);
            core.setOutput('has_tests', String(rows.length > 0));
            core.setOutput('test_matrix', JSON.stringify({ include: rows }));

  test:
    needs: setup
    if: ${{ needs.setup.outputs.should_run == 'true' && needs.setup.outputs.has_tests == 'true' }}
    name: ${{ matrix.suite }} (${{ matrix.php }}, ${{ matrix.moodle }}, ${{ matrix.moodle_repository }}, ${{ matrix.os }}, ${{ matrix.dbtype }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      MOODLE_CI_APP_ID_VALUE: ${{ secrets.MOODLE_CI_APP_ID || vars.MOODLE_CI_APP_ID }}
      HAS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MOODLE_CI_APP_PRIVATE_KEY != '' }}
      PRIVATE_ACCESS_OWNER: ${{ inputs.org || vars.MOODLE_ORG || github.repository_owner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.test_matrix) }}

    steps:
      - name: Validate GitHub App configuration
        id: app-config
        shell: bash
        run: |
          if [ -z "$MOODLE_CI_APP_ID_VALUE" ] && [ "$HAS_GITHUB_APP_PRIVATE_KEY" != "true" ]; then
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$MOODLE_CI_APP_ID_VALUE" ] || [ "$HAS_GITHUB_APP_PRIVATE_KEY" != "true" ]; then
            echo "::warning::Both MOODLE_CI_APP_ID and MOODLE_CI_APP_PRIVATE_KEY are required to use the GitHub App token."
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$MOODLE_CI_APP_ID_VALUE" =~ ^[0-9]+$ ]]; then
            echo "::error::MOODLE_CI_APP_ID must be the numeric GitHub App ID, not the Client ID, app name, or installation ID."
            exit 1
          fi

          echo "has_app=true" >> "$GITHUB_OUTPUT"

      - name: Resolve GitHub App token repositories
        id: app-repos
        if: ${{ steps.app-config.outputs.has_app == 'true' }}
        shell: bash
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
          MOODLE_REPOSITORY: ${{ matrix.moodle_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          owner="$PRIVATE_ACCESS_OWNER"
          repos_file="$(mktemp)"

          add_repo() {
            local full="$1"
            [ -n "$full" ] || return 0
            local r_owner="${full%%/*}"
            local r_name="${full#*/}"
            if [ "$r_owner" = "$full" ]; then
              r_name="$full"
              r_owner="$owner"
            fi
            if [ "$r_owner" = "$owner" ] && [ -n "$r_name" ]; then
              printf '%s\n' "$r_name" >> "$repos_file"
            fi
          }

          add_repo "$CURRENT_REPOSITORY"
          add_repo "$MOODLE_REPOSITORY"
          for dep in $DEPENDENCIES; do
            [ -n "$dep" ] || continue
            add_repo "${dep%@*}"
          done

          {
            echo "repositories<<EOF"
            sort -u "$repos_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "GitHub App token will request access to:"
          sort -u "$repos_file" | sed 's/^/  - /'
          rm -f "$repos_file"

      - name: Create GitHub App token
        id: app-token
        if: ${{ steps.app-config.outputs.has_app == 'true' }}
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ env.MOODLE_CI_APP_ID_VALUE }}
          private-key: ${{ secrets.MOODLE_CI_APP_PRIVATE_KEY }}
          owner: ${{ env.PRIVATE_ACCESS_OWNER }}
          repositories: ${{ steps.app-repos.outputs.repositories }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Warn about GitHub App token failure
        if: ${{ steps.app-config.outputs.has_app == 'true' && steps.app-token.outcome == 'failure' }}
        shell: bash
        env:
          APP_REPOSITORIES: ${{ steps.app-repos.outputs.repositories }}
        run: |
          echo "::warning::Could not create GitHub App token for owner ${PRIVATE_ACCESS_OWNER} with repositories: ${APP_REPOSITORIES//$'\n'/, }. Ensure the App is installed on that org and has Contents: Read on each listed repository."

      - name: Require GitHub App token for private checkout
        if: ${{ steps.app-token.outputs.token == '' || steps.app-token.outputs.token == null }}
        shell: bash
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
          MOODLE_REPOSITORY: ${{ matrix.moodle_repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Collect clone targets that may need authenticated access.
          # Public repos are cloneable without an App token; private or
          # inaccessible ones are not.
          targets_file="$(mktemp)"
          errors_file="$(mktemp)"
          trap 'rm -f "$targets_file" "$errors_file"' EXIT

          add_target() {
            local full="$1"
            [ -n "$full" ] || return 0
            # Strip optional @ref from org/repo@ref dependency entries.
            full="${full%@*}"
            case "$full" in
              */*) printf '%s\n' "$full" >> "$targets_file" ;;
            esac
          }

          add_target "$MOODLE_REPOSITORY"
          for dep in $DEPENDENCIES; do
            add_target "$dep"
          done

          if [ ! -s "$targets_file" ]; then
            exit 0
          fi

          probe_repo() {
            local repo="$1"
            local owner="${repo%%/*}"
            local body_file
            local code
            local private

            # Official moodle/* hosts are always treated as public.
            if [ "$owner" = "moodle" ]; then
              return 0
            fi

            body_file="$(mktemp)"
            code="$(curl -sS -o "$body_file" -w "%{http_code}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}" || true)"

            case "$code" in
              200)
                private="$(jq -r '.private | if . == true then "true" elif . == false then "false" else "unknown" end' "$body_file" 2>/dev/null || echo unknown)"
                rm -f "$body_file"
                if [ "$private" = "false" ]; then
                  return 0
                fi
                if [ "$private" = "true" ]; then
                  printf '%s\n' "${repo}: private repository (visible to GITHUB_TOKEN) requires a GitHub App installation token with Contents: Read. Configure MOODLE_CI_APP_ID and MOODLE_CI_APP_PRIVATE_KEY, install the App on ${PRIVATE_ACCESS_OWNER}, and grant access to this repository." >> "$errors_file"
                  return 0
                fi
                printf '%s\n' "${repo}: unexpected repository payload (HTTP 200 without a usable private flag). Re-check the repository name or configure a GitHub App token." >> "$errors_file"
                ;;
              404)
                rm -f "$body_file"
                # GitHub returns 404 for both missing repos and private repos the
                # token cannot see, so keep the message deliberately ambiguous.
                printf '%s\n' "${repo}: cannot access repository (HTTP 404). It is either private (needs a GitHub App installation token with Contents: Read on ${PRIVATE_ACCESS_OWNER}) or the org/repo name does not exist. Check the spelling, or configure MOODLE_CI_APP_ID and MOODLE_CI_APP_PRIVATE_KEY and install the App with access to this repository." >> "$errors_file"
                ;;
              403)
                rm -f "$body_file"
                printf '%s\n' "${repo}: access denied (HTTP 403). Grant the GitHub App Contents: Read on this repository (configure MOODLE_CI_APP_ID and MOODLE_CI_APP_PRIVATE_KEY, install on ${PRIVATE_ACCESS_OWNER}), or ensure the repository is public." >> "$errors_file"
                ;;
              401)
                rm -f "$body_file"
                printf '%s\n' "${repo}: authentication failed (HTTP 401) while probing visibility. Configure MOODLE_CI_APP_ID and MOODLE_CI_APP_PRIVATE_KEY for private checkout." >> "$errors_file"
                ;;
              *)
                rm -f "$body_file"
                printf '%s\n' "${repo}: GitHub API lookup failed (HTTP ${code:-unknown}). Configure MOODLE_CI_APP_ID and MOODLE_CI_APP_PRIVATE_KEY if this repository is private, or verify the org/repo name." >> "$errors_file"
                ;;
            esac
          }

          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            probe_repo "$repo"
          done < <(sort -u "$targets_file")

          if [ ! -s "$errors_file" ]; then
            exit 0
          fi

          {
            echo "::error::One or more checkout targets are not publicly cloneable without a GitHub App installation token:"
            sed 's/^/  - /' "$errors_file"
            echo "Public repositories and public plugin dependencies do not require the App. Private Moodle forks and private dependencies do."
          } >&2
          exit 1

      - name: Check out moodle-test-action subactions
        uses: actions/checkout@v6
        with:
          repository: praxisdigital/moodle-test-action
          ref: ${{ inputs.action_ref }}
          path: .moodle-test-action
          persist-credentials: false

      - name: Run Behat tests when requested
        if: ${{ matrix.suite == 'behat' }}
        uses: ./.moodle-test-action/behat-test
        with:
          pull_request_number: ${{ inputs.pull_request_number || needs.setup.outputs.pull_request_number }}
          checkout_ref: ${{ needs.setup.outputs.checkout_ref }}
          moodle: ${{ matrix.moodle }}
          php: ${{ matrix.php }}
          dbtype: ${{ matrix.dbtype }}
          moodle_repository: ${{ matrix.moodle_repository }}
          dependencies: ${{ matrix.dependencies }}
          additional_behat_arguments: ${{ format('{0} {1}', inputs.additional_behat_arguments || vars.MOODLE_ADDITIONAL_BEHAT_ARGUMENTS || '', needs.setup.outputs.behat_tag_arguments) }}
          behat_increase_timeout: ${{ inputs.behat_increase_timeout }}
          behat_step_timeout_minutes: ${{ inputs.behat_step_timeout_minutes }}
          post_no_tests_comment: ${{ inputs.post_no_tests_comment || (needs.setup.outputs.is_behat_comment == 'true' && 'true' || 'false') }}
          PRIVATE_REPO_TOKEN: ${{ steps.app-token.outputs.token }}
          status_token: ${{ steps.app-token.outputs.token || github.token }}
          status_sha: ${{ needs.setup.outputs.is_behat_comment == 'true' && needs.setup.outputs.pull_request_head_sha || '' }}
          status_context: ${{ needs.setup.outputs.is_behat_comment == 'true' && format('Moodle CI / behat on demand ({0}, {1}, {2}, {3})', matrix.php, matrix.moodle, matrix.moodle_repository, matrix.dbtype) || '' }}
          status_tags: ${{ needs.setup.outputs.behat_tags }}

      - name: Run PHPUnit tests
        if: ${{ matrix.suite == 'phpunit' }}
        uses: ./.moodle-test-action/phpunit-test
        with:
          plugin: ${{ inputs.plugin_component || vars.MOODLE_PLUGIN_COMPONENT || '' }}
          plugin-path: ${{ inputs.plugin_path || vars.MOODLE_PLUGIN_PATH || '' }}
          php: ${{ matrix.php }}
          moodle: ${{ matrix.moodle }}
          moodle_repository: ${{ matrix.moodle_repository }}
          os: ${{ matrix.os }}
          additional_phpunit_arguments: ${{ inputs.additional_phpunit_arguments || vars.MOODLE_ADDITIONAL_PHPUNIT_ARGUMENTS || '' }}
          org: ${{ inputs.org || vars.MOODLE_ORG || 'praxisdigital' }}
          dependencies: ${{ matrix.dependencies }}
          dbtype: ${{ matrix.dbtype }}
          experimental: ${{ matrix.experimental }}
          PRIVATE_REPO_TOKEN: ${{ steps.app-token.outputs.token }}
          fail_on_empty_test_suite: ${{ inputs.fail_on_empty_test_suite }}
          checkout_ref: ${{ needs.setup.outputs.checkout_ref }}
