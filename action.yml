name: moodle-test-action
description: 'Run Moodle PHPUnit tests and optionally Behat tests'

inputs:
  plugin:
    description: 'Plugin name (component name). Optional override; if empty, it will be auto-detected from version.php.'
    required: false
    default: ''
  plugin-path:
    description: 'Plugin path'
    required: false
    default: ''
  php:
    description: 'PHP version'
    required: false
    default: ''
  moodle:
    description: 'Moodle version (branch, tag or commit)'
    required: false
    default: ''
  moodle_repository:
    description: 'Moodle repository, e.g. moodle/moodle'
    required: false
    default: ''
  os:
    description: 'Operating system'
    required: false
    default: ''
  additional_phpunit_arguments:
    description: 'Additional arguments to pass to phpunit'
    required: false
    default: ''
  org:
    description: 'Organization'
    required: false
    default: 'praxisdigital'
  dependencies:
    description: 'Plugin dependencies in org/repo@ref format, one per line or space separated'
    required: false
    default: ''
  dbtype:
    description: 'Database type (mysqli, pgsql, sqlsrv)'
    required: false
    default: ''
  experimental:
    description: 'Is experimental run'
    required: false
    default: 'false'
  PRIVATE_REPO_TOKEN:
    description: 'Token for private repositories'
    required: false
    default: ''
  fail_on_empty_test_suite:
    description: 'Fail the job if PHPUnit executes no tests'
    required: false
    default: 'true'
  run_phpunit:
    description: 'Run PHPUnit tests'
    required: false
    default: 'true'
  run_behat:
    description: 'Run Behat tests when feature files are present'
    required: false
    default: 'false'
  additional_behat_arguments:
    description: 'Additional arguments to pass to the Moodle Behat runner'
    required: false
    default: ''
  behat_increase_timeout:
    description: 'Multiplier for Moodle Behat timeouts; use 0 to disable'
    required: false
    default: '2'
  behat_step_timeout_minutes:
    description: 'Maximum minutes allowed for the Behat runner step'
    required: false
    default: '45'
  post_no_tests_comment:
    description: 'Post a PR comment when Behat is requested but no Behat feature files exist'
    required: false
    default: 'false'
  pull_request_number:
    description: 'Optional pull request number to test; auto-detected for issue_comment and pull_request events'
    required: false
    default: ''
  action_ref:
    description: 'moodle-test-action ref used for local subactions. Defaults to the ref used by this action, then master.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Check out moodle-test-action subactions
      if: ${{ inputs.run_phpunit == 'true' || inputs.run_behat == 'true' }}
      uses: actions/checkout@v6
      with:
        repository: praxisdigital/moodle-test-action
        ref: ${{ inputs.action_ref || github.action_ref || 'master' }}
        path: .moodle-test-action
        persist-credentials: false

    - name: Run PHPUnit tests
      if: ${{ inputs.run_phpunit == 'true' }}
      uses: ./.moodle-test-action/phpunit-test
      with:
        plugin: ${{ inputs.plugin }}
        plugin-path: ${{ inputs.plugin-path }}
        php: ${{ inputs.php || '8.4' }}
        moodle: ${{ inputs.moodle || 'MOODLE_502_STABLE' }}
        moodle_repository: ${{ inputs.moodle_repository || 'moodle/moodle' }}
        os: ${{ inputs.os || 'ubuntu-latest' }}
        additional_phpunit_arguments: ${{ inputs.additional_phpunit_arguments }}
        org: ${{ inputs.org || 'praxisdigital' }}
        dependencies: ${{ inputs.dependencies }}
        dbtype: ${{ inputs.dbtype || 'mysqli' }}
        experimental: ${{ inputs.experimental }}
        PRIVATE_REPO_TOKEN: ${{ inputs.PRIVATE_REPO_TOKEN }}
        fail_on_empty_test_suite: ${{ inputs.fail_on_empty_test_suite }}

    - name: Run Behat tests when present
      if: ${{ inputs.run_behat == 'true' }}
      uses: ./.moodle-test-action/behat-test
      with:
        moodle: ${{ inputs.moodle || 'MOODLE_502_STABLE' }}
        php: ${{ inputs.php || '8.4' }}
        dbtype: ${{ inputs.dbtype || 'mysqli' }}
        moodle_repository: ${{ inputs.moodle_repository || 'moodle/moodle' }}
        dependencies: ${{ inputs.dependencies }}
        additional_behat_arguments: ${{ inputs.additional_behat_arguments }}
        behat_increase_timeout: ${{ inputs.behat_increase_timeout }}
        behat_step_timeout_minutes: ${{ inputs.behat_step_timeout_minutes }}
        post_no_tests_comment: ${{ inputs.post_no_tests_comment || (github.event_name == 'issue_comment' && 'true' || 'false') }}
        pull_request_number: ${{ inputs.pull_request_number }}
        PRIVATE_REPO_TOKEN: ${{ inputs.PRIVATE_REPO_TOKEN }}
